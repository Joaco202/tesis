detection:
  model: yolov8n.pt
  confidence: 0.25
  iou: 0.45
  classes: null
ocr:
  lang: es
  use_angle_cls: true
  confusion_map:
    "0": "O"
    "1": "I"
    "2": "Z"
    "3": "B"
    "4": "A"
    "5": "S"
    "6": "G"
    "7": "T"
    "8": "B"
    "9": "G"
  max_confusion_subs: 2
  aggressive_confusion: true
runtime:
  device: cuda
  save_annotated: true
  default_camera_id: camara-1
  default_event_type: entrada
supabase:
  enabled: true
  timeout_seconds: 10
  vehicles_table: vehiculos
  accesses_table: accesos
